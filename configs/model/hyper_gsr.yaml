name: hyper_gsr

# ------------------------------
# Target-Edge Initializer
# ------------------------------
target_edge_initializer:
  num_heads: 4
  edge_dim: 1
  dropout: 0.2
  beta: false

# ------------------------------
# Hyper-Dual Learner
# ------------------------------
hyper_dual_learner:
  in_dim: 1
  hidden_dim: 32
  dropout: 0.1
  mode: trans            # Use TransformerConv for bidirectional bipartite message passing
  heads: 4
  edge_dim: 1            # Incidence attribute width; geometry uses scalar distances
  use_hyper_emb: True

  # ---- geometry priors: enable distance and ROI coordinates together ----
  use_geo_priors: False
  edge_geo_dim: 8
  dist_norm: zscore

  # ---- shrink output ----
  use_shrink_output: True
  shrink_threshold: 0.01
